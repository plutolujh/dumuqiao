name: Deploy dumuqiao to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dumuqiao-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: env

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The website is served straight off the filesystem, so the repo root maps
      # to VPS_DEPLOY_PATH. analytics-api/ lives in this repo too, but it is a
      # service with its own directory -- it is excluded here and deployed
      # separately below.
      - name: Deploy website files to VPS
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='analytics-api' \
            . "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      # analytics-api is the standalone Cloudflare Web Analytics proxy that
      # backs the dashboard's /api/analytics. It runs as its own systemd unit
      # on port 3002 and is deliberately independent of the tide project.
      #
      # Credentials are NOT in the repo: /etc/analytics-api/analytics.env must
      # already exist on the VPS.
      - name: Deploy analytics-api service to VPS
        run: |
          ANALYTICS_PATH="$(dirname "$VPS_DEPLOY_PATH")/analytics-api"
          KEY="$HOME/.ssh/deploy_key"
          OPTS="-i $KEY -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          ssh $OPTS "$VPS_USER@$VPS_HOST" "install -d -m 755 '$ANALYTICS_PATH'"
          rsync -av --delete --chown=root:root \
            -e "ssh $OPTS" \
            analytics-api/ "$VPS_USER@$VPS_HOST:$ANALYTICS_PATH/"
          ssh $OPTS "$VPS_USER@$VPS_HOST" \
            "install -m 644 '$ANALYTICS_PATH/analytics-api.service' /etc/systemd/system/analytics-api.service \
             && systemctl daemon-reload \
             && systemctl restart analytics-api \
             && systemctl is-active analytics-api"

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumuqiao-website
          path: |
            !.git/
            !.gitignore
            !.DS_Store
          retention-days: 7
